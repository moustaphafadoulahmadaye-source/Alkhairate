<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — EAEPCG</title><link rel="stylesheet" href="assets/css/style.css">
</head>
<body><div id="site-header"></div><main>
<div class="page-hero" style="text-align:center;max-width:640px;"><h1><span data-fr>Nouveau mot de passe</span><span data-en>New password</span><span data-ar>كلمة مرور جديدة</span></h1></div>
<section style="padding-top:0;"><div class="form-card"><form id="resetForm">
<div class="field"><label>Password (min. 10 characters)</label><input type="password" name="password" minlength="10" maxlength="128" required></div>
<div class="field"><label>Confirm password</label><input type="password" name="password_confirmation" minlength="10" maxlength="128" required></div>
<button class="btn btn-primary btn-block" type="submit">Reset password</button><div id="formMsg" class="form-msg"></div>
</form></div></section></main><div id="site-footer"></div><script src="assets/js/api.js"></script><script src="assets/js/components.js"></script><script>
renderHeader('login.html'); renderFooter(); const token=new URLSearchParams(location.search).get('token')||'';
document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('formMsg'),fd=new FormData(e.target);try{const d=await apiFetch('/auth/reset-password',{method:'POST',body:JSON.stringify({token,password:fd.get('password'),password_confirmation:fd.get('password_confirmation')})});msg.className='form-msg show ok';msg.textContent=d.message;e.target.reset();}catch(err){msg.className='form-msg show err';msg.textContent=err.data?.error||localizedText('loadError');}});
</script></body></html>
