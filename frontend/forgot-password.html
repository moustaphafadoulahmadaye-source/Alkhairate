<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — EAEPCG</title><link rel="stylesheet" href="assets/css/style.css">
</head>
<body><div id="site-header"></div><main>
<div class="page-hero" style="text-align:center;max-width:640px;"><h1><span data-fr>Mot de passe oublié</span><span data-en>Forgot password</span><span data-ar>نسيت كلمة المرور</span></h1></div>
<section style="padding-top:0;"><div class="form-card"><form id="forgotForm">
<div class="field"><label>Email</label><input type="email" name="email" required></div>
<button class="btn btn-primary btn-block" type="submit"><span data-fr>Envoyer le lien</span><span data-en>Send reset link</span><span data-ar>إرسال رابط الاستعادة</span></button>
<div id="formMsg" class="form-msg"></div></form><p class="form-note"><a href="login.html">Retour à la connexion</a></p></div></section>
</main><div id="site-footer"></div><script src="assets/js/api.js"></script><script src="assets/js/components.js"></script><script>
renderHeader('login.html'); renderFooter();
document.getElementById('forgotForm').addEventListener('submit', async e=>{e.preventDefault();const msg=document.getElementById('formMsg');const email=new FormData(e.target).get('email');try{const d=await apiFetch('/auth/forgot-password',{method:'POST',body:JSON.stringify({email})});msg.className='form-msg show ok';msg.textContent=d.message;e.target.reset();}catch(err){msg.className='form-msg show err';msg.textContent=err.data?.error||localizedText('loadError');}});
</script></body></html>
