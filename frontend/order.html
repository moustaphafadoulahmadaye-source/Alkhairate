<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Passer commande — EAEPCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero" style="text-align:center; max-width:640px;">
  <div class="eyebrow" style="justify-content:center;"><span class="dot"></span><span data-fr>Commande</span><span data-en>Order</span><span data-ar>طلب</span></div>
  <h1><span data-fr>Passer une commande</span><span data-en>Place an order</span><span data-ar>تقديم طلب</span></h1>
</div>
<section style="padding-top:0;" id="cartSection">
  <div class="form-card" id="cartCard" style="max-width:640px;">
    <h2 style="font-size:24px; margin-bottom:24px;" id="orderMainTitle"><span data-fr>Mon Panier</span><span data-en>My Cart</span><span data-ar>سلة التسوق</span></h2>
    <div id="cartContent"></div>
  </div>
</section>

<!-- Order history (only for logged-in users) -->
<section style="padding-top:0;" id="historySection" hidden>
  <div class="section-inner" style="margin-top:20px;">
    <div class="section-head"><h2 style="font-size:20px;"><span data-fr>Mes commandes</span><span data-en>My orders</span><span data-ar>طلباتي</span></h2></div>
    <div class="table-wrap" id="ordersTableWrap">
      <table><thead><tr>
        <th>Service</th><th><span data-fr>Détails</span><span data-en>Details</span><span data-ar>تفاصيل</span></th><th><span data-fr>Statut</span><span data-en>Status</span><span data-ar>الحالة</span></th><th>Date</th>
      </tr></thead><tbody id="ordersBody"></tbody></table>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/api.js?v=3"></script>
<script src="assets/js/components.js?v=3"></script>
<script src="assets/js/pages/order.js"></script>
</body>
</html>
