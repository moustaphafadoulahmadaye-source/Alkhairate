<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Catalogue — EAEPCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  /* Category Pills */
  .category-filter {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 16px;
    margin-bottom: 32px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .category-filter::-webkit-scrollbar { display: none; }
  
  .filter-pill {
    padding: 10px 24px;
    background: #f1f5f9;
    color: #475569;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    border: 2px solid transparent;
    transition: all 0.2s ease;
  }
  .filter-pill:hover { background: #e2e8f0; }
  .filter-pill.active {
    background: var(--blue-deep);
    color: white;
    box-shadow: 0 4px 12px rgba(11, 42, 138, 0.2);
  }

  /* Item Grid (from product.html) */
  .item-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:24px;}
  
  .item-card{
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    color: var(--text-main);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  }
  .item-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
    border-color: var(--brand-primary);
  }
  .icon-wrap {
    width: 48px; height: 48px; border-radius: 50%;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
  }
  .item-img {
    width: 100%; height: 200px; border-radius: 12px; overflow: hidden;
    margin-bottom: 6px;
    background: #f8fafc;
    border: 1px solid #f1f5f9;
  }
  .item-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .item-card:hover .item-img img { transform: scale(1.08); }
  
  .item-name { 
    font-family: 'Outfit', sans-serif; 
    font-size: 16px; 
    font-weight: 700;
    line-height: 1.4; 
    color: var(--text-main);
  }
  .item-price { 
    font-family: 'Space Grotesk', sans-serif; 
    font-weight: 700;
    font-size: 18px; 
    color: var(--brand-primary); 
    margin-top: auto; 
  }
  
  .item-stock { 
    font-size: 11px; 
    font-weight: 700; 
    text-transform: uppercase; 
    padding: 4px 10px; 
    border-radius: 6px; 
    display: inline-block; 
    align-self: flex-start; 
    letter-spacing: 0.05em; 
  }
  .item-stock.yes { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .item-stock.no { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

  .item-card-btn {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    background: transparent;
    border: 1.5px solid var(--brand-primary);
    color: var(--brand-primary);
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s ease;
  }
  .item-card:hover .item-card-btn {
    background: var(--brand-primary);
    color: white;
  }

  .empty-category { grid-column: 1 / -1; padding: 40px; text-align: center; color: #64748b; background: #f8fafc; border-radius: 16px; border: 2px dashed #e2e8f0; }
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero">
  <div class="eyebrow"><span class="dot"></span><span data-fr>Catalogue Technique</span><span data-en>Technical Catalog</span><span data-ar>الكتالوج الفني</span></div>
  <h1 id="heroTitle"><span data-fr>Chargement…</span><span data-en>Loading…</span><span data-ar>جاري التحميل…</span></h1>
  <p class="lead" id="heroDesc"></p>
</div>
<section style="padding-top:0;">
  <div class="section-inner" id="catalogContainer">
    <p><span data-fr>Chargement…</span><span data-en>Loading…</span><span data-ar>جاري التحميل…</span></p>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/pages/products.js"></script>
</body>
</html>
