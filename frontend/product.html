<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Produit — EAEPCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--blue-deep); margin-bottom:12px; text-decoration:none; text-transform:uppercase; letter-spacing:0.05em;}
  .back-link:hover{color:var(--yellow);}
  .cat-section{margin-bottom:48px;}
  .cat-title{font-family:'Archivo Black'; font-size:16px; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:24px; padding-bottom:12px; border-bottom:2px solid rgba(11, 42, 138, 0.1); color: var(--blue-deep);}
  
  .item-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:24px;}
  
  /* Blue Service-style Item Card */
  .item-card{
    background: var(--blue-deep);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    color: white;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    box-shadow: 0 8px 16px rgba(0,0,0,0.08);
  }
  .item-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 32px rgba(11, 42, 138, 0.25);
    border-color: rgba(245, 197, 24, 0.5); /* subtil reflet jaune */
  }
  
  /* Yellow icon circle (when no image) */
  .icon-wrap {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
  }
  
  /* Image wrapper (when image uploaded) */
  .item-img {
    width: 100%; height: 180px; border-radius: 10px; overflow: hidden;
    margin-bottom: 6px;
  }
  .item-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
  .item-card:hover .item-img img { transform: scale(1.05); }
  
  .item-name { font-family: 'Archivo Black', sans-serif; font-size: 15px; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.02em; }
  .item-price { font-family: 'Archivo Black', sans-serif; font-size: 18px; color: var(--yellow); margin-top: auto; }
  
  .item-stock { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; display: inline-block; align-self: flex-start; letter-spacing: 0.05em; }
  .item-stock.yes { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
  .item-stock.no { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
  
  .order-cta{margin-top:48px; text-align:center;}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero" id="productHero">
  <a class="back-link" href="products.html">← <span data-fr>Retour aux produits</span><span data-en>Back to products</span><span data-ar>العودة للمنتجات</span></a>
  <div class="eyebrow"><span class="dot"></span><span id="heroEyebrow"></span></div>
  <h1 id="heroTitle"><span data-fr>Chargement…</span><span data-en>Loading…</span><span data-ar>جاري التحميل…</span></h1>
  <p class="lead" id="heroDesc"></p>
</div>
<section style="padding-top:0;">
  <div class="section-inner" id="itemsContainer"><p><span data-fr>Chargement…</span><span data-en>Loading…</span><span data-ar>جاري التحميل…</span></p></div>
  <div class="order-cta" style="display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap;">
    <a class="btn btn-primary" href="order.html"><span data-fr>Commander ce produit</span><span data-en>Order this product</span><span data-ar>اطلب هذا المنتج</span></a>
    <button type="button" class="btn btn-outline" id="btnShareProduct" style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
      <span>📤</span> <span data-fr>Partager</span><span data-en>Share</span><span data-ar>مشاركة</span>
    </button>
    <a class="btn btn-outline" id="btnProductWhatsApp" href="#" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/pages/product.js"></script>
</body>
</html>
