name: Build Mobile (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'scripts/prepare-mobile.js'
      - '.github/workflows/build-mobile.yml'

jobs:
  # =========================================================
  # 1. BUILD ANDROID (AAB pour Google Play Store)
  # =========================================================
  build-android:
    if: github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'android' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Web Assets for Mobile
        run: npm run prepare:mobile

      - name: Setup Firebase google-services.json (if secret configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Injecting google-services.json from secret..."
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building without Firebase Push plugin."
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Signed Android App Bundle (Release AAB)
        id: build_aab
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Secrets de signature Android non configurés (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            echo "::warning::Compilation d'un bundle release de validation (non signé pour publication)..."
            cd android
            chmod +x gradlew
            ./gradlew bundleRelease --stacktrace
            echo "has_signed_aab=false" >> $GITHUB_OUTPUT
            echo "::notice::La compilation du bundle Android release a réussi ! Pour produire l'AAB signé pour Google Play, ajoutez les 4 secrets dans GitHub (Settings > Secrets > Actions)."
            exit 0
          fi

          echo "Décodage sécurisé du keystore de signature..."
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks
          if [ ! -s /tmp/release.jks ]; then
            echo "::error::Le fichier keystore décodé est vide ou corrompu."
            exit 1
          fi

          cd android
          chmod +x gradlew
          export KEYSTORE_PATH="/tmp/release.jks"
          ./gradlew bundleRelease --stacktrace

          # Nettoyage immédiat du fichier keystore éphémère
          rm -f /tmp/release.jks

          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -s "$AAB_FILE" ]; then
            echo "::error::Échec : Aucun bundle AAB release signé n'a été généré."
            exit 1
          fi
          echo "has_signed_aab=true" >> $GITHUB_OUTPUT
          echo "✅ Bundle AAB release signé généré avec succès : $AAB_FILE"

      - name: Upload Signed Android Release Bundle
        if: steps.build_aab.outputs.has_signed_aab == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alkheyrat-android-release-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  # =========================================================
  # 2. COMPILATION iOS SANS SIGNATURE (Vérification syntaxe & plugins)
  # =========================================================
  compile-ios-unsigned:
    if: github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'ios' || github.event_name == 'push'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select Xcode 16
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app || sudo xcode-select -switch /Applications/Xcode_16.1.app || sudo xcode-select -switch /Applications/Xcode_16.0.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Web Assets for Mobile
        run: npm run prepare:mobile

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Test iOS Compilation (Unsigned Build Check)
        run: |
          cd ios/App
          SIM_ID=$(xcrun simctl list devices available | grep -m 1 -E "iPhone" | grep -o -E "[A-F0-9-]{36}" | head -n 1)
          if [ -n "$SIM_ID" ]; then
            DESTINATION="id=$SIM_ID"
            echo "Simulateur iOS disponible détecté : $DESTINATION"
          else
            DESTINATION="platform=iOS Simulator,name=iPhone 16"
            echo "Fallback vers nom simulateur : $DESTINATION"
          fi

          set +e
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build > /tmp/xcode_build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "### ❌ Échec de compilation iOS (code $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            (grep -i -C 2 -E "error:|fatal error:|BUILD FAILED" /tmp/xcode_build.log || tail -n 80 /tmp/xcode_build.log) >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::error::Échec de compilation iOS (code $STATUS)."
            tail -n 120 /tmp/xcode_build.log
            exit $STATUS
          fi
          echo "### ✅ Compilation iOS validée avec succès !" >> $GITHUB_STEP_SUMMARY

      - name: Upload iOS Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-failure-log
          path: /tmp/xcode_build.log
          if-no-files-found: ignore

  # =========================================================
  # 3. BUILD iOS SIGNÉ & DÉPLOIEMENT TESTFLIGHT (App Store Connect)
  # =========================================================
  deploy-ios-testflight:
    if: github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'ios' || github.event_name == 'push'
    runs-on: macos-15
    needs: [compile-ios-unsigned]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select Xcode 16
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app || sudo xcode-select -switch /Applications/Xcode_16.1.app || sudo xcode-select -switch /Applications/Xcode_16.0.app || sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Web Assets for Mobile
        run: npm run prepare:mobile

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Validate Apple Signing Secrets
        id: check_apple_secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_PROVISION_PROFILE_BASE64" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "::warning::Secrets de signature Apple ou clés App Store Connect non configurés."
            echo "::notice::La compilation du projet iOS a été validée avec succès dans l'étape précédente (compile-ios-unsigned). Pour déployer vers TestFlight, configurez les 6 secrets Apple dans GitHub (Settings > Secrets > Actions)."
            echo "has_apple_secrets=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_apple_secrets=true" >> $GITHUB_OUTPUT

      - name: Install Apple Distribution Certificate & Provisioning Profile
        if: steps.check_apple_secrets.outputs.has_apple_secrets == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          # Créer le trousseau temporaire
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Importer le certificat P12
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Installer le profil de provisioning
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

          # Générer ExportOptions.plist
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.alkhairat.energie</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
              <key>destination</key>
              <string>export</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Archive and Export Signed IPA
        if: steps.check_apple_secrets.outputs.has_apple_secrets == 'true'
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

          IPA_PATH=$(ls $RUNNER_TEMP/export/*.ipa 2>/dev/null | head -n 1)
          if [ -z "$IPA_PATH" ] || [ ! -s "$IPA_PATH" ]; then
            echo "::error::Aucun fichier IPA signé n'a été produit."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV
          echo "✅ IPA produit avec succès : $IPA_PATH"

      - name: Upload IPA to TestFlight
        if: steps.check_apple_secrets.outputs.has_apple_secrets == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          echo "Envoi vers TestFlight via App Store Connect API..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          rm -rf ~/.appstoreconnect/private_keys

      - name: Upload Signed iOS IPA Artifact
        if: steps.check_apple_secrets.outputs.has_apple_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alkheyrat-ios-signed-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean Up Keychain
        if: always() && steps.check_apple_secrets.outputs.has_apple_secrets == 'true'
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain $KEYCHAIN_PATH || true
          fi
          rm -rf ~/.appstoreconnect/private_keys || true
